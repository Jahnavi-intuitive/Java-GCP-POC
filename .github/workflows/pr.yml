name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trebol-poc/trebol-app

defaults:
  run:
    working-directory: trebol-backend-monolith

jobs:
  test:
    name: Build, test and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: trebol-backend-monolith/pom.xml

      - name: Build and run tests with coverage
        run: mvn -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(path):
              print("### Test coverage\nNo coverage report was produced.")
          else:
              covered = missed = 0
              with open(path) as f:
                  for row in csv.DictReader(f):
                      covered += int(row["LINE_COVERED"])
                      missed += int(row["LINE_MISSED"])
              total = covered + missed
              pct = 100 * covered / total if total else 0
              print("### Test coverage")
              print(f"Line coverage: **{pct:.1f}%** ({covered} of {total} lines)")
          PYEOF

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < Dockerfile

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            trebol-backend-monolith/target/surefire-reports
            trebol-backend-monolith/target/site/jacoco
          if-no-files-found: ignore

  image:
    name: Image build, scan and push
    needs: test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker use the Google login
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: >
          docker buildx build
          --platform linux/amd64
          --provenance=false --sbom=false
          --load
          -t "$IMAGE:${{ github.event.pull_request.head.sha }}"
          -t "$IMAGE:pr-${{ github.event.pull_request.number }}"
          .

      - name: Scan image with Trivy (report-only unless TRIVY_BLOCK=true)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: ${{ vars.TRIVY_BLOCK == 'true' && '1' || '0' }}

      - name: Add scan report to the job summary
        if: always()
        run: |
          echo '### Trivy image scan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_WORKSPACE/trivy-report.txt" >> "$GITHUB_STEP_SUMMARY" || echo "No report produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.event.pull_request.head.sha }}"
          docker push "$IMAGE:pr-${{ github.event.pull_request.number }}"