############################################################
# PRODUCTION PROFILE. Activate with SPRING_PROFILES_ACTIVE=prod
# Every environment-specific value comes from an environment variable.
# A ${VAR} with no default is MANDATORY: the app refuses to start without it.
############################################################

# ---- Server ----
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
server.compression.enabled=true
server.forward-headers-strategy=native

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ---- Schema migrations (Flyway) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.placeholders.admin_password_hash=${ADMIN_PASSWORD_HASH}

# ---- Security ----
trebol.security.jwt-secret-key=${JWT_SECRET_KEY}
trebol.security.jwt-expiration-after-minutes=${JWT_EXPIRATION_MINUTES:30}
trebol.security.bcrypt-encoder-strength=${BCRYPT_STRENGTH:10}
trebol.security.guest-user-enabled=${GUEST_USER_ENABLED:false}
trebol.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ---- Integrations (optional for this POC) ----
trebol.payment.webpayplus.production=${WEBPAY_PRODUCTION:false}
trebol.payment.webpayplus.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:8080/public/checkout/validate}
trebol.payment.webpayplus.browser-redirection-url=${PAYMENT_REDIRECT_URL:http://localhost:4200/store/receipt}

# ---- Observability ----
# liveness never depends on the DB; readiness does (see Part B)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.trebol=${LOG_LEVEL_APP:INFO}